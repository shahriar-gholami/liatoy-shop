<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>در حال انتقال به درگاه پرداخت...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 48px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        
        .spinner {
            width: 64px;
            height: 64px;
            border: 4px solid #334155;
            border-top-color: #22D3EE;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #F8FAFC;
        }
        
        p {
            font-size: 15px;
            color: #94A3B8;
            line-height: 1.6;
        }
        
        .error {
            background: #7F1D1D;
            border: 1px solid #991B1B;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .error-title {
            font-weight: 600;
            color: #FCA5A5;
            margin-bottom: 8px;
        }
        
        .error-message {
            color: #FECACA;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>در حال اتصال به درگاه پرداخت</h1>
        <p>لطفاً صبر کنید، در حال انتقال به زرین‌پال هستید...</p>
        
        <div class="error" id="error">
            <div class="error-title">خطا در اتصال</div>
            <div class="error-message" id="error-message"></div>
        </div>
    </div>

    <script>
        (function() {
            const data = {
                merchant_id: "{{ merchant_id }}",
                amount: {{ amount }},
                callback_url: "{{ callback_url }}",
                description: "{{ description }}",
                metadata: {
                    mobile: "{{ mobile }}",
                    email: "{{ email }}"
                }
            };

            fetch("https://api.zarinpal.com/pg/v4/payment/request.json", {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.data && result.data.code === 100) {
                    const authority = result.data.authority;
                    window.location.href = `https://www.zarinpal.com/pg/StartPay/${authority}`;
                } else {
                    showError(`کد خطا: ${result.data ? result.data.code : 'نامشخص'}`);
                }
            })
            .catch(error => {
                showError('خطا در برقراری ارتباط با درگاه پرداخت. لطفاً مجدداً تلاش کنید.');
                console.error('Payment error:', error);
            });

            function showError(message) {
                document.getElementById('error-message').textContent = message;
                document.getElementById('error').classList.add('show');
            }
        })();
    </script>
</body>
</html>
